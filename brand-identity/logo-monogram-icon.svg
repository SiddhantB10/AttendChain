<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D37E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C1E"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500&amp;display=swap');
      .monogram {
        font-family: 'Cormorant Garamond', 'Didot', Georgia, serif;
        font-size: 165px;
        font-weight: 700;
        fill: url(#goldGrad);
      }
      .ring-text {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 5.5px;
        fill: #FAF6F0;
      }
    </style>
  </defs>

  <!-- Deep Royal Jamun Plum Circle -->
  <circle cx="250" cy="250" r="240" fill="#3D1A3A"/>
  
  <!-- Double Gold Ornamental Rings -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Twin Sparkle Stars at Top (representing the twin 'ii' of Sahelii) -->
  <g transform="translate(232, 92)">
    <path d="M0,-16 C2,-4 4,-2 16,0 C4,2 2,4 0,16 C-2,4 -4,2 -16,0 C-4,-2 -2,-4 0,-16 Z" fill="url(#goldGrad)"/>
  </g>
  <g transform="translate(268, 82)">
    <path d="M0,-12 C1.5,-3 3,-1.5 12,0 C3,1.5 1.5,3 0,12 C-1.5,3 -3,1.5 -12,0 C-3,-1.5 -1.5,-3 0,-12 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Intertwined HS Monogram -->
  <text x="210" y="295" text-anchor="middle" class="monogram">H</text>
  <text x="295" y="295" text-anchor="middle" class="monogram">S</text>

  <!-- Royal Lotus Base Motif -->
  <g transform="translate(250, 368)" fill="url(#goldGrad)">
    <!-- Center Petal -->
    <path d="M0,-32 C10,-16 10,2 0,16 C-10,2 -10,-16 0,-32 Z"/>
    <!-- Inner Left & Right Petals -->
    <path d="M-6,14 C-24,4 -28,-12 -22,-26 C-12,-18 -6,-4 -6,14 Z" opacity="0.9"/>
    <path d="M6,14 C24,4 28,-12 22,-26 C12,-18 6,-4 6,14 Z" opacity="0.9"/>
    <!-- Outer Left & Right Petals -->
    <path d="M-12,16 C-34,12 -44,-2 -40,-16 C-26,-12 -16,0 -12,16 Z" opacity="0.75"/>
    <path d="M12,16 C34,12 44,-2 40,-16 C26,-12 16,0 12,16 Z" opacity="0.75"/>
  </g>

  <!-- Bottom Brand Name inside Badge -->
  <text x="253" y="422" text-anchor="middle" class="ring-text">HOUSE OF SAHELII</text>
</svg>
